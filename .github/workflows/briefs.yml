name: Send Cadence briefs

# Two ways it runs:
#  • Automatically on a cron — sends whatever is in briefs.yaml when it's due.
#  • Manually via "Run workflow" — a form asks what you want, and it saves that
#    as your brief AND emails you a copy right away.
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (UTC); each brief has its own local time
  workflow_dispatch:
    inputs:
      query:
        description: "What information do you need?"
        required: true
        default: "A summary of how the Nifty 50 performed in the latest session: open, close, day's range, % change, the stocks/sectors driving it, and key market news. Skimmable."
      email:
        description: "Deliver to which email? (leave blank to use your saved RECIPIENT_EMAIL)"
        required: false
        default: ""
      frequency:
        description: "How often?"
        required: true
        type: choice
        default: daily
        options:
          - daily
          - every_2_days
          - every_3_days
          - weekly
      time_of_day:
        description: "Time of day to deliver (HH:MM, 24-hour)"
        required: true
        default: "08:00"
      timezone:
        description: "Timezone (IANA name, e.g. Asia/Kolkata, America/New_York)"
        required: true
        default: "Asia/Kolkata"
      day_of_week:
        description: "If 'weekly': which day (0=Mon, 1=Tue … 6=Sun)"
        required: false
        default: "0"

permissions:
  contents: write   # to save briefs.yaml + the last-sent state

concurrency:
  group: cadence-briefs
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Cadence
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'Cadence <onboarding@resend.dev>' }}
          # These are empty on scheduled runs (=> deliver mode) and populated
          # from the form on manual runs (=> configure + send now).
          BRIEF_QUERY: ${{ inputs.query }}
          BRIEF_EMAIL: ${{ inputs.email }}
          BRIEF_FREQUENCY: ${{ inputs.frequency }}
          BRIEF_TIME: ${{ inputs.time_of_day }}
          BRIEF_TZ: ${{ inputs.timezone }}
          BRIEF_DOW: ${{ inputs.day_of_week }}
        run: python send_due_briefs.py

      - name: Persist briefs.yaml + state
        run: |
          git add briefs.yaml .cadence_state.json
          if ! git diff --cached --quiet; then
            git config user.name "cadence-bot"
            git config user.email "actions@github.com"
            git commit -m "chore: update Cadence brief/state [skip ci]"
            git push
          else
            echo "Nothing to persist."
          fi
